<!-- Page shell. scripts/build.mjs inlines src/styles/*.css at @styles and src/app/*.js at @script. -->
<!-- @head -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4.5 5.5h11v13a1.5 1.5 0 0 0 1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5zM15.5 9h4v9.5a1.5 1.5 0 0 1-3 0M7.5 9h5M7.5 12.5h5M7.5 16h3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle cx="5" cy="6.5" r=".9"/><circle cx="5" cy="12" r=".9"/><circle cx="5" cy="17.5" r=".9"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
    <symbol id="i-mpause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 9v6M14 9v6"/></symbol>
    <symbol id="i-mplay" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.8v6.4l5-3.2z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10.2-6.4a.8.8 0 0 0 0-1.4L9.2 4.9a.8.8 0 0 0-1.2.7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.8" height="13" rx="1.2"/><rect x="13.7" y="5.5" width="3.8" height="13" rx="1.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9l6.5 6.5L18.5 9"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M8 16l8-8M9.5 8H16v6.5"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7L8 16M8 9.5V16h6.5"/></symbol>
    <symbol id="i-outward" viewBox="0 0 24 24"><path d="M7 17l9-9M9.5 8H16v6.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <a class="skip" href="#list" id="skip">Skip to the list of all trends</a>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="rgb(255 255 255 / .35)" stroke-width="1.5"/><circle cx="16" cy="16" r="8" fill="none" stroke="rgb(255 255 255 / .35)" stroke-width="1.5"/><path class="slice" d="M16 16L16 2A14 14 0 0 1 29.3 11.7z"/><circle cx="16" cy="16" r="2.4" fill="#fff"/></svg>
      <div><b>Tech Trend Radar</b><small class="upd">Loading…</small></div>
    </div>
    <nav class="tools" aria-label="Tools">
      <button class="tool" id="t-motion" type="button" aria-label="Pause motion"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mpause"/></svg></button>
      <button class="tool" id="t-list" type="button" aria-label="All trends as a list"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list"/></svg></button>
      <button class="tool" id="t-search" type="button" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg></button>
      <button class="tool" id="t-news" type="button" aria-label="All news"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-news"/></svg><span class="tcount" id="t-count" hidden></span></button>
      <button class="tool" id="t-info" type="button" aria-label="How this radar works"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-info"/></svg></button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="rbox" id="rbox" data-ring="" role="group" aria-label="Radar of technology megatrends. Closer to the centre means act sooner. Use the arrow keys to move between trends, plus and minus to zoom." aria-describedby="r-sum">
      <svg id="radar">
        <g id="g-bands"></g>
        <g id="g-trails"></g>
        <g id="g-blips"></g>
        <g id="g-labels" aria-hidden="true"></g>
      </svg>
      <div class="sweep" id="sweep" aria-hidden="true"></div>
      <div class="fx" id="fx" aria-hidden="true"><i class="fxr fx-sel" id="fx-sel"></i><i class="fxr fx-cue" id="fx-cue"></i></div>
      <button class="quad q-ai" type="button" data-area="ai" aria-pressed="false">AI &amp; agents</button>
      <button class="quad q-sec" type="button" data-area="sec" aria-pressed="false">Security &amp; trust</button>
      <button class="quad q-cloud" type="button" data-area="cloud" aria-pressed="false">Data &amp; platforms</button>
      <button class="quad q-sci" type="button" data-area="sci" aria-pressed="false">Frontier tech</button>
      <button class="btn allbtn" id="allbtn" type="button" hidden>Show whole radar</button>
    </div>
    <div class="zoomui" role="group" aria-label="Zoom">
      <button class="zbtn" id="z-in" type="button" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="zbtn" id="z-out" type="button" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-minus"/></svg></button>
    </div>
    <p class="sr" id="r-sum"></p>
    <section class="dock" id="dock" aria-label="Latest news" aria-live="polite"></section>
  </main>

  <aside class="panel" id="panel" aria-label="Details">
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div class="p-top" id="p-top">
      <label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search trends and news" autocomplete="off" spellcheck="false" aria-label="Search trends and news"></label>
    </div>
    <div class="p-head" id="p-head" hidden></div>
    <div class="p-body" id="p-body"></div>
  </aside>

  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<!-- @script -->
