<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A radar of 20 technology megatrends for technology leaders, with news from top-tier sources every 12 hours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%228%22%20fill=%22%2302041c%22/%3E%3Ccircle%20cx=%2216%22%20cy=%2216%22%20r=%2211%22%20fill=%22none%22%20stroke=%22%23ffffff66%22%20stroke-width=%222%22/%3E%3Cpath%20d=%22M16%2016V5a11%2011%200%200%201%2010.5%207.6z%22%20fill=%22%23ff7800%22/%3E%3Ccircle%20cx=%2216%22%20cy=%2216%22%20r=%222.5%22%20fill=%22%23fff%22/%3E%3C/svg%3E">
<title>Tech Trend Radar</title>
<style>
/* One screen: the radar is the app. A glass side panel (bottom sheet on phones) shows whatever you tap, Apple Maps style. */
:root {
  color-scheme: dark;
  interpolate-size: allow-keywords;
  --bg: #02041c;
  --orange: #ff7800;
  --orange-hi: #ff9a3d;
  --yellow: #fabf11;
  --sky: #00b4dc;
  --peri: #4f78f5;
  --act: var(--orange);
  --prepare: var(--yellow);
  --watch: var(--sky);
  --horizon: var(--peri);
  --t1: #f4f6ff;
  --t2: rgb(228 233 255 / .76);
  --t3: rgb(228 233 255 / .54);
  --line: rgb(255 255 255 / .1);
  --line2: rgb(255 255 255 / .18);
  --glass: rgb(22 28 78 / .46);
  --glass-strong: rgb(10 14 44 / .72);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
  --side: 388px;
  --gap: 16px;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--t1); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
[hidden] { display: none !important; }
.c-act { --c: var(--act); } .c-prepare { --c: var(--prepare); } .c-watch { --c: var(--watch); } .c-horizon { --c: var(--horizon); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* backdrop */
.app { position: fixed; inset: 0; isolation: isolate; overflow: hidden; }
.aurora { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(110% 90% at 70% 0%, #0a1460 0%, var(--bg) 60%); }

/* brand */
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.logo { width: 32px; height: 32px; flex: none; }
.brand b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.012em; white-space: nowrap; }
.brand small { display: block; font-size: 12.5px; color: var(--t3); white-space: nowrap; }
.topbar { display: none; }

/* side panel (bottom sheet on phones) */
.panel {
  position: absolute; z-index: 10; left: var(--gap); top: var(--gap); bottom: var(--gap); width: var(--side);
  display: flex; flex-direction: column; overflow: hidden; border-radius: 30px; timeline-scope: --pb;
  /* Near-opaque glass: looks the same over the dark stage, without a costly live blur behind a large surface. */
  background: linear-gradient(180deg, rgb(255 255 255 / .07), rgb(255 255 255 / .015) 28%), rgb(11 15 46 / .95);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .15), 0 24px 48px -24px rgb(0 0 30 / .9);
}
.grab { display: none; }
.p-top { flex: none; padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 14px; }
.search { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; border-radius: 13px; background: rgb(0 0 0 / .3); border: 1px solid var(--line); color: var(--t3); transition: border-color .2s, background .2s; }
.search:focus-within { border-color: rgb(0 180 220 / .6); background: rgb(0 0 0 / .4); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 15px; color: var(--t1); }
.search input::placeholder { color: var(--t3); }
.search input::-webkit-search-cancel-button { display: none; }
kbd { font: 600 11.5px var(--font); color: var(--t3); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; }
.p-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 6px; min-height: 42px; border-bottom: 1px solid transparent; }
.p-head .ht { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .08); color: var(--t2); display: grid; place-items: center; cursor: pointer; flex: none; transition: background .2s, color .2s, transform .15s; }
.iconbtn:hover { background: rgb(255 255 255 / .16); color: var(--t1); }
.iconbtn:active { transform: scale(.92); }
.iconbtn[disabled] { opacity: .35; pointer-events: none; }
.p-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 20px 28px; scroll-timeline: --pb y; scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / .2) transparent; display: flex; flex-direction: column; gap: 22px; }
.p-body.enter > :first-child, .p-body.enter > :nth-child(2) { animation: rise .24s var(--ease) both; }
.p-body.enter > :nth-child(2) { animation-delay: .03s; }
.p-body.enter > :nth-child(n+3) { animation: fadein .24s var(--ease) .05s both; }
@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@supports (animation-timeline: scroll()) {
  .p-head .ht.collapse { animation: ht-in linear both; animation-timeline: --pb; animation-range: 50px 110px; }
  @keyframes ht-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* home */
.last { margin: 6px 0 0; font-size: 13px; color: var(--t3); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn { min-width: 0; }
.cta .btn.primary { flex: 1 1 140px; }
.rbox.tiny .rl { display: none; }
.rbox.small .quad small { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: rgb(255 255 255 / .08); color: var(--t1); font-weight: 650; cursor: pointer; white-space: nowrap; transition: transform .18s var(--ease), background .2s; }
.btn:hover { background: rgb(255 255 255 / .14); }
.btn:active { transform: scale(.96); }
.btn small { font-size: 12.5px; font-weight: 600; opacity: .72; }
.btn.primary { flex: 1; border-color: transparent; color: #241000; background: linear-gradient(180deg, #ffa24a, var(--orange)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .45), 0 12px 28px -12px rgb(255 120 0 / .8); }
.btn.primary:hover { background: linear-gradient(180deg, #ffad5c, #ff8516); }
.btn .ic { width: 17px; height: 17px; }
.btn.primary .ic { fill: currentColor; stroke: none; }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #fff; color: #06103a; font: 760 11.5px/20px var(--round); text-align: center; font-variant-numeric: tabular-nums; }
.sec h2 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--t3); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec h2 span { font-weight: 600; }
.rows { display: flex; flex-direction: column; margin: 0 -10px; }
.trow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; border-radius: 14px; background: none; text-align: left; cursor: pointer; transition: background .15s; }
.trow:hover { background: rgb(255 255 255 / .07); }
.tdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px rgb(255 255 255 / .12); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.tt { min-width: 0; }
.tt b { display: block; font-weight: 650; letter-spacing: -.006em; }
.tt small { display: block; color: var(--t3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pillnew { flex: none; height: 22px; padding: 0 8px; border-radius: 11px; background: #fff; color: #06103a; font: 720 12px/22px var(--round); white-space: nowrap; }
.chev { color: var(--t3); width: 16px; height: 16px; }
.pillmove { flex: none; height: 22px; padding: 0 8px; border-radius: 11px; background: rgb(255 120 0 / .2); color: #ffb36b; font: 700 12px/22px var(--round); white-space: nowrap; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: auto; padding-top: 6px; }
.link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--t2); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }
.link:hover { color: var(--t1); }
.link .ic { width: 16px; height: 16px; }
.muted { color: var(--t3); margin: 0; font-size: 14px; }
.skel { height: 14px; border-radius: 7px; background: linear-gradient(100deg, rgb(255 255 255 / .05) 30%, rgb(255 255 255 / .12) 50%, rgb(255 255 255 / .05) 70%) 0 0 / 220% 100%; animation: shim 1.4s linear infinite; }
@keyframes shim { to { background-position: -220% 0; } }

/* trend page */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 13px; border: 0; background: rgb(255 255 255 / .08); color: var(--t2); font-size: 12.5px; font-weight: 650; cursor: pointer; }
.tag.ring { color: var(--c); background: rgb(255 255 255 / .06); color: color-mix(in srgb, var(--c) 72%, white); background: color-mix(in srgb, var(--c) 16%, transparent); cursor: default; }
.tag.ring i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
button.tag:hover { background: rgb(255 255 255 / .14); color: var(--t1); }
.tt2 { margin: 12px 0 0; font-size: 27px; line-height: 1.1; font-weight: 760; letter-spacing: -.026em; text-wrap: balance; outline: none; }
.lead { margin: 8px 0 0; font-size: 16.5px; line-height: 1.42; color: var(--t2); text-wrap: pretty; }
.moved { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; padding: 10px 12px; border-radius: 14px; background: rgb(255 255 255 / .07); font-size: 13.5px; color: var(--t1); }
.moved .ic { color: var(--orange-hi); margin-top: 1px; }
.news { display: flex; flex-direction: column; margin: 0 -10px; }
.ni { border-radius: 16px; transition: background .2s; }
.ni.open { background: rgb(255 255 255 / .05); }
.ni-h { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 11px; align-items: start; width: 100%; padding: 10px; border: 0; background: none; border-radius: 16px; text-align: left; cursor: pointer; }
.ni-h:hover { background: rgb(255 255 255 / .06); }
.ni-k { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgb(255 255 255 / .06); color: var(--c); background: color-mix(in srgb, var(--c) 16%, rgb(255 255 255 / .05)); color: color-mix(in srgb, var(--c) 70%, white); }
.ni-k .ic { width: 16px; height: 16px; }
.ni-t b { display: block; font-weight: 620; line-height: 1.3; letter-spacing: -.004em; }
.ni-t small { display: block; margin-top: 2px; color: var(--t3); font-size: 12.5px; }
.nd { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgb(255 255 255 / .16); transition: transform .3s var(--spring), opacity .3s; }
.ni:not(.new) .nd { transform: scale(0); opacity: 0; }
.ni-x { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.ni.open .ni-x { grid-template-rows: 1fr; }
.ni-in { overflow: hidden; padding: 0 12px 0 51px; }
.ni.open .ni-in { padding-bottom: 12px; }
.ni-in p { margin: 0 0 8px; color: var(--t2); font-size: 14.5px; line-height: 1.45; }
.ni-a { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.ni-a small { color: var(--t3); font-size: 12.5px; }
.out { display: inline-flex; align-items: center; gap: 4px; color: var(--t1); font-weight: 650; font-size: 14px; text-decoration: none; }
.out:hover { text-decoration: underline; }
.out .ic { width: 14px; height: 14px; color: var(--t3); }
.bul { margin: 0 0 10px; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; color: var(--t2); font-size: 14.5px; line-height: 1.42; }
.fold { border-top: 1px solid var(--line); }
.fold summary { display: flex; align-items: center; gap: 8px; padding: 14px 0; cursor: pointer; list-style: none; font-weight: 650; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary small { color: var(--t3); font-weight: 600; font-size: 13px; }
.fold summary .chev { margin-left: auto; transition: transform .25s var(--ease); }
.fold[open] summary .chev { transform: rotate(90deg); }
.fold::details-content { block-size: 0; overflow: clip; transition: block-size .35s var(--ease), content-visibility .35s allow-discrete; }
.fold[open]::details-content { block-size: auto; }
.fold-in { padding: 0 0 14px; }
.caveat { display: flex; gap: 8px; margin: 0; padding: 10px 12px; border-radius: 12px; background: rgb(250 191 17 / .1); border: 1px solid rgb(250 191 17 / .28); font-size: 13.5px; line-height: 1.4; }
.caveat .ic { color: var(--yellow); width: 16px; height: 16px; margin-top: 1px; }
.alist, .slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.alist li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; }
.alist b { font-size: 13px; color: var(--t3); font-weight: 650; }
.alist span { font-weight: 620; }
.alist .out { font-size: 12.5px; font-weight: 600; color: var(--t2); }
.slist small { display: block; color: var(--t3); font-size: 12.5px; margin-top: 1px; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--t2); }
.hist time { display: block; font-size: 12.5px; color: var(--t3); }
.fine { margin: 8px 0 0; color: var(--t3); font-size: 12px; }

/* news page */
.seg2 { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: rgb(0 0 0 / .3); }
.seg2 button { height: 34px; border: 0; border-radius: 9px; background: none; color: var(--t2); font-weight: 650; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: background .25s var(--ease), color .2s; }
.seg2 button[aria-selected="true"] { background: rgb(255 255 255 / .16); color: var(--t1); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2); }
.seg2 small { font: 700 12px var(--round); opacity: .7; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: -8px -20px 0; padding: 0 20px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid var(--line); background: rgb(255 255 255 / .05); color: var(--t2); font-size: 13.5px; font-weight: 620; cursor: pointer; transition: background .2s, color .2s; }
.chip:hover { background: rgb(255 255 255 / .1); }
.chip[aria-pressed="true"] { background: #fff; color: #06103a; border-color: transparent; }
.day { margin: 0 0 -14px; font-size: 13px; font-weight: 700; color: var(--t3); }
.caught { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 0 10px; text-align: center; color: var(--t2); }
.caught .ic { width: 44px; height: 44px; color: var(--sky); stroke-width: 1.6; }
.caught .ic use { stroke-dasharray: 60; animation: draw .8s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 60; } }
.caught p { margin: 0; font-size: 17px; font-weight: 650; color: var(--t1); }

/* about */
.rings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rings li { display: grid; grid-template-columns: 14px 78px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14px; }
.rings i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); align-self: center; }
.rings span { color: var(--t2); }
.basis { display: flex; flex-wrap: wrap; gap: 6px; }
.basis span { padding: 5px 10px; border-radius: 10px; background: rgb(255 255 255 / .06); font-size: 12.5px; color: var(--t2); }
.scans { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--t2); }
.scans time { display: block; color: var(--t3); font-size: 12.5px; }
.keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; color: var(--t2); align-items: center; }
.keys kbd { justify-self: start; }

/* briefing */
.bseg { display: flex; gap: 4px; }
.bseg button { flex: 1; height: 16px; padding: 6px 0; border: 0; background: none; cursor: pointer; }
.bseg span { display: block; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .18); overflow: hidden; }
.bseg i { display: block; height: 100%; background: #fff; transform-origin: 0 50%; transform: scaleX(0); }
.bseg .sd i { transform: none; }
.bslide { min-height: 210px; display: flex; flex-direction: column; gap: 8px; }
.bkick { display: inline-flex; align-items: center; gap: 8px; color: var(--c, #fff); color: color-mix(in srgb, var(--c, #fff) 72%, white); font-weight: 700; font-size: 13px; }
.bkick i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, #fff); }
.btitle { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 760; letter-spacing: -.024em; text-wrap: balance; }
.btext { margin: 0; font-size: 17px; line-height: 1.42; color: var(--t2); text-wrap: pretty; }
.btext b { color: #ffb36b; font-weight: 700; }
.bsrc { margin: 0; color: var(--t3); font-size: 13px; }
.bctl { display: flex; align-items: center; justify-content: center; gap: 14px; }

.bctl .iconbtn[aria-pressed="true"] { background: rgb(0 180 220 / .25); color: #fff; }

/* stage */
.stage { position: absolute; top: 0; bottom: 0; right: 0; left: calc(var(--side) + var(--gap) * 2); overflow: hidden; }
.rbox { position: absolute; left: 50%; top: calc(50% - 30px); width: var(--rs, 600px); height: var(--rs, 600px); translate: -50% -50%; }
.rbox svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sweep { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; background: conic-gradient(from 0deg, rgb(0 180 220 / 0) 0deg 280deg, rgb(0 180 220 / .07) 320deg, rgb(130 225 255 / .32) 359deg, rgb(255 255 255 / 0) 360deg); }
.quad { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1px; border: 0; background: none; padding: 6px 8px; border-radius: 12px; color: var(--t1); font-size: 14px; font-weight: 700; cursor: pointer; transition: background .2s, opacity .3s; }
.quad small { color: var(--t3); font-size: 12.5px; font-weight: 600; }
.quad:hover { background: rgb(255 255 255 / .07); }
.q-ai { left: -8px; top: -8px; text-align: left; }
.q-sec { right: -8px; top: -8px; align-items: flex-end; text-align: right; }
.q-cloud { left: -8px; bottom: -8px; text-align: left; }
.q-sci { right: -8px; bottom: -8px; align-items: flex-end; text-align: right; }
.rbox.zoomed .quad { opacity: 0; pointer-events: none; }
.allbtn { position: absolute; z-index: 3; left: 50%; top: -6px; translate: -50% 0; }
.glassbtn { border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .14); }

/* radar */
.band { fill: none; stroke: rgb(255 255 255 / .12); stroke-width: 1; }
.b-act { fill: url(#g-act); stroke: rgb(255 150 60 / .4); }
.b-prepare { fill: rgb(250 191 17 / .025); }
.b-watch { fill: rgb(0 180 220 / .02); }
.b-horizon { fill: rgb(79 120 245 / .025); }
.axis { stroke: rgb(255 255 255 / .07); stroke-width: 1; }
.rl { font: 650 11px var(--font); fill: var(--t3); letter-spacing: .01em; paint-order: stroke; stroke: rgb(2 4 28 / .9); stroke-width: 4px; stroke-linejoin: round; transition: fill .3s, opacity .3s; }
.rl.on { fill: #fff; }
.rbox[data-ring]:not([data-ring=""]) .rl:not(.on) { opacity: .35; }
.blip { cursor: pointer; outline: none; transition: opacity .35s; }
.blip .hit { fill: transparent; }
.blip .glow { fill: var(--c); opacity: .22; }
.blip .dot { fill: var(--c); stroke: rgb(255 255 255 / .7); stroke-width: 1.2; }
.blip .ring { fill: none; stroke: #fff; stroke-width: 2; opacity: 0; transition: opacity .2s; }
.blip.sel .ring, .blip:focus-visible .ring { opacity: 1; }
.blip .pop { transform-box: fill-box; transform-origin: center; transition: transform .4s var(--spring); }
.blip:hover .pop, .blip.hot .pop, .blip.sel .pop, .blip:focus-visible .pop { transform: scale(1.25); }
.bdr { fill: #fff; stroke: rgb(2 4 28 / .9); stroke-width: 2; }

<script>
(() => {
  'use strict';

  /* ---------- helpers ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const $ = (q, r) => (r || document).querySelector(q);
  const $$ = (q, r) => Array.from((r || document).querySelectorAll(q));
  const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') el.textContent = str(v);
      else if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(3)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(str(c)));
    return el;
  }
  function sv(tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    for (const c of kids.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(str(c)));
    return el;
  }
  const ic = (name, cls) => sv('svg', { class: 'ic' + (cls ? ' ' + cls : ''), viewBox: '0 0 24 24', 'aria-hidden': 'true' }, sv('use', { href: '#' + name }));
  function safeUrl(u) { try { const x = new URL(str(u)); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } }
  const ls = {
    get(k, d) { try { const v = localStorage.getItem('ttr3.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ttr3.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  const mqRM = matchMedia('(prefers-reduced-motion: reduce)'), mqPhone = matchMedia('(max-width: 899px) and (min-height: 500px), (max-width: 559px)');
  let RM = mqRM.matches, PHONE = mqPhone.matches;
  const onMq = (mq, fn) => (mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn));
  onMq(mqRM, e => { RM = e.matches; });

  /* ---------- vocabulary ---------- */
  const AREAS = {
    ai: { label: 'AI & agents', a0: 180, cx: -.5, cy: -.5 },
    sec: { label: 'Security & trust', a0: 270, cx: .5, cy: -.5 },
    cloud: { label: 'Cloud & engineering', a0: 90, cx: -.5, cy: .5 },
    sci: { label: 'Frontier tech', a0: 0, cx: .5, cy: .5 }
  };
  const AO = ['ai', 'sec', 'cloud', 'sci'];
  const RINGS = {
    act: { label: 'Act now', hint: 'Decide or move this quarter', r0: 0, r1: .44, dot: 6 },
    prepare: { label: 'Prepare', hint: 'Plan and pilot within 12 months', r0: .44, r1: .67, dot: 5.5 },
    watch: { label: 'Watch', hint: 'Track it, likely 1 to 3 years out', r0: .67, r1: .85, dot: 5 },
    horizon: { label: 'Horizon', hint: 'Research stage, 3 or more years out', r0: .85, r1: 1, dot: 4.5 }
  };
  const RO = ['act', 'prepare', 'watch', 'horizon'];
  const KINDS = { report: ['Report', 'i-doc'], paper: ['Paper', 'i-flask'], podcast: ['Podcast', 'i-mic'], announcement: ['Announcement', 'i-spark'], rule: ['Rule', 'i-columns'], advisory: ['Advisory', 'i-alert'] };
  const KF = [['all', 'All'], ['report', 'Reports'], ['paper', 'Papers'], ['podcast', 'Podcasts'], ['announcement', 'Announcements'], ['rule', 'Rules'], ['advisory', 'Advisories']];
  const STYPES = [['consultancy', 'Analysts and consultancies'], ['journal', 'Journals'], ['lab', 'Research labs'], ['platform', 'Platforms and vendors'], ['public', 'Regulators and standards bodies'], ['podcast', 'Podcasts']];
  // "Your move": a first step, the decision leaders own and the signal that would change the rating.
  const MOVE = [['first', 'Start'], ['decide', 'Decide'], ['watch', 'Watch for']];
  const moveOf = t => (t && t.move && typeof t.move === 'object' && t.move.first ? t.move : t && t.do ? { first: str(t.do) } : null);
  const doText = t => { const m = moveOf(t); return m ? (m.bottom ? str(m.bottom) + ' ' : '') + MOVE.filter(([k]) => m[k]).map(([k, l]) => l + ': ' + str(m[k])).join(' ') : ''; };
  const validTo = t => (ts(t && t.validUntil) ? fmtDay(ts(t.validUntil)) : '');
  const byReading = (a, b) => RO.indexOf(a.ring) - RO.indexOf(b.ring) || AO.indexOf(a.area) - AO.indexOf(b.area) || str(a.title).localeCompare(str(b.title));
  const tkeys = n => (n.t2 && n.t2 !== n.t ? [n.t, n.t2] : [n.t]);

  /* ---------- dates ---------- */
  const DAY = 864e5;
  function ts(at) {
    at = str(at);
    if (/^\d{4}$/.test(at)) return Date.UTC(+at, 0, 1);
    if (/^\d{4}-\d{2}$/.test(at)) { const p = at.split('-'); return Date.UTC(+p[0], +p[1] - 1, 1); }
    if (/^\d{4}-\d{2}-\d{2}$/.test(at)) return Date.parse(at + 'T00:00:00Z') || 0;
    return Date.parse(at) || 0;
  }
  const F = {
    day: new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }),
    dayY: new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
    wday: new Intl.DateTimeFormat('en-GB', { weekday: 'long', timeZone: 'UTC' }),
    month: new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }),
    visit: new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
    scan: new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
    rel: typeof Intl.RelativeTimeFormat === 'function' ? new Intl.RelativeTimeFormat('en', { numeric: 'auto' }) : null
  };
  function dayDiff(t) { const n = new Date(); return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - t) / DAY); }
  function fmtDay(t) { return (new Date(t).getUTCFullYear() === new Date().getFullYear() ? F.day : F.dayY).format(new Date(t)); }
  function when(at) {
    at = str(at);
    if (!at) return '';
    if (/^\d{4}$/.test(at)) return at;
    if (/^\d{4}-\d{2}$/.test(at)) return F.month.format(new Date(ts(at)));
    const t = ts(at.slice(0, 10)), d = dayDiff(t);
    if (!t) return '';
    if (d <= 0) return 'Today';
    if (d === 1) return 'Yesterday';
    return fmtDay(t);
  }
  function bucket(at) {
    at = str(at);
    if (/^\d{4}(-\d{2})?$/.test(at)) return at.length === 4 ? at : F.month.format(new Date(ts(at)));
    const t = ts(at.slice(0, 10)), d = dayDiff(t);
    if (d <= 0) return 'Today';
    if (d === 1) return 'Yesterday';
    if (d < 7) return F.wday.format(new Date(t));
    return fmtDay(t);
  }
  function ago(iso) {
    const t = ts(iso);
    if (!t || !F.rel) return '';
    const m = Math.round((Date.now() - t) / 6e4);
    if (m < 1) return 'just now';
    if (m < 60) return F.rel.format(-m, 'minute');
    if (m < 60 * 36) return F.rel.format(-Math.round(m / 60), 'hour');
    return F.rel.format(-Math.round(m / 1440), 'day');
  }

  /* ---------- state ---------- */
  const S = {
    trends: [], byId: new Map(), news: [], byT: new Map(), sources: [], scans: [], meta: null,
    months: {}, subs: {}, older: [], ok: { trends: false, news: false, me: false }, problem: '',
    db: null, sample: null, ring: null, quad: null, sel: null, newsTab: null, kind: 'all', q: '', open: new Set()
  };
  let D = { since: 0, newBy: new Map(), total: 0, trendsNew: 0, moved: new Map() };

  /* ---------- what is new for this viewer ---------- */
  // Kept in the viewer's private db subtree when the account allows it, else in this browser, else for this visit only.
  const Me = {
    d: { v: 4, mark: null, opened: {}, seenT: {}, follow: {}, last: null, prev: null },
    ref: null, mode: 'visit', busy: false, again: false, timer: 0,
    load(x) {
      if (!x || typeof x !== 'object') return;
      const d = this.d;
      if (ts(x.mark)) d.mark = str(x.mark);
      if (x.opened && typeof x.opened === 'object') for (const k in x.opened) if (typeof x.opened[k] === 'number') d.opened[k] = x.opened[k];
      if (x.seenT && typeof x.seenT === 'object') for (const k in x.seenT) if (ts(x.seenT[k])) d.seenT[k] = str(x.seenT[k]);
      if (ts(x.last)) d.last = str(x.last);
      if (ts(x.prev)) d.prev = str(x.prev);
      if (x.follow && typeof x.follow === 'object') for (const k in x.follow) if (x.follow[k] === true) d.follow[k] = true;
    },
    async init(db, user) {
      let uid = null;
      try { uid = user && typeof user.id === 'function' ? await user.id() : null; } catch (e) { uid = null; }
      if (db && uid) {
        try {
          const ref = db.doc('data/users/' + uid + '/state'), snap = await ref.get();
          this.ref = ref;
          this.mode = 'account';
          this.load(snap.exists ? snap.data() : ls.get('me'));
        } catch (e) { this.ref = null; }
      }
      if (!this.ref) { this.load(ls.get('me')); this.mode = ls.set('probe', 1) ? 'browser' : 'visit'; }
      const now = Date.now(), last = ts(this.d.last);
      if (!last || now - last > 30 * 6e4) { this.d.prev = this.d.last; this.d.last = new Date(now).toISOString(); this.save(); }
    },
    save() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700); },
    async flush() {
      if (this.busy) { this.again = true; return; }
      this.busy = true;
      this.prune();
      const body = JSON.parse(JSON.stringify(this.d));
      if (this.ref) {
        try { await this.ref.set(body); }
        catch (e) { this.ref = null; this.mode = ls.set('me', body) ? 'browser' : 'visit'; }
      } else if (this.mode === 'browser') ls.set('me', body);
      this.busy = false;
      if (this.again) { this.again = false; this.flush(); }
    },
    prune() {
      const s = since(), o = this.d.opened;
      for (const k of Object.keys(o)) if (o[k] <= s) delete o[k];
      const left = Object.keys(o);
      if (left.length > 500) left.sort((a, b) => o[a] - o[b]).slice(0, left.length - 500).forEach(k => delete o[k]);
    }
  };
  function since() { const m = ts(Me.d.mark), now = Date.now(); return m ? Math.max(m, now - 21 * DAY) : now - 7 * DAY; }
  function derive() {
    const s = since(), by = new Map();
    let total = 0;
    for (const n of S.news) {
      const t = ts(n.seen) || ts(n.at);
      n._new = S.ok.me && t > s && !Me.d.opened[n.id];
      if (n._new) { total++; for (const k of tkeys(n)) if (S.byId.has(k)) by.set(k, (by.get(k) || 0) + 1); }
    }
    const moved = new Map();
    if (S.ok.me) for (const t of S.trends) {
      const after = Math.max(s, ts(Me.d.seenT[t.id]));
      let mv = null;
      for (const x of Array.isArray(t.history) ? t.history : []) if (x && RINGS[x.from] && x.from !== x.ring && x.ring === t.ring && ts(x.at) > after) mv = x;
      if (mv) moved.set(t.id, mv);
    }
    D = { since: s, newBy: by, total, trendsNew: by.size, moved };
  }
  function markNews(items, force) {
    let ch = !!force;
    for (const n of items) if (!Me.d.opened[n.id]) { Me.d.opened[n.id] = ts(n.seen) || ts(n.at) || Date.now(); ch = true; }
    if (ch) { Me.save(); refresh(true); }
  }
  function markAll() {
    let mx = Date.now();
    for (const n of S.news) mx = Math.max(mx, ts(n.seen));
    Me.d.mark = new Date(mx).toISOString();
    Me.d.opened = {};
    Me.d.seenT = {};
    Me.save();
    refresh();
    toast('All caught up');
  }

  }
  (() => {
    const el = $('#dock'), hold = on => { if (AP.busy || AP.hold === on) return; AP.hold = on; el.classList.toggle('hold', on); if (!on) renderDock('quiet'); else apArm(); };
    el.addEventListener('pointerenter', e => e.pointerType !== 'touch' && hold(true));
    el.addEventListener('pointerleave', e => e.pointerType !== 'touch' && hold(false));
    el.addEventListener('focusin', () => hold(true));
    el.addEventListener('focusout', e => { if (!el.contains(e.relatedTarget)) hold(false); });
  })();
  // Swipe (finger or mouse drag) to move through the news bar and the briefing; a swipe never counts as a click.
  function swipe(el, target, fn) {
    let st = null;
    el.addEventListener('pointerdown', e => { if ((e.button != null && e.button > 0) || e.target.closest('.dk-ctl, .bctl, .bseg, a')) return; st = { x: e.clientX, y: e.clientY, id: e.pointerId, dx: 0, h: false }; });
    el.addEventListener('pointermove', e => {
      if (!st || e.pointerId !== st.id) return;
      st.dx = e.clientX - st.x;
      if (!st.h && Math.abs(st.dx) > 10 && Math.abs(st.dx) > Math.abs(e.clientY - st.y) * 1.5) st.h = true;
      const t = st.h && el.querySelector(target);
      if (t) t.style.transform = 'translateX(' + (st.dx * .35).toFixed(1) + 'px)';
    });
    const end = e => {
      if (!st || e.pointerId !== st.id) return;
      const t = el.querySelector(target), go = st.h && Math.abs(st.dx) > 40, d = st.dx < 0 ? 1 : -1;
      if (t) t.style.transform = '';
      if (st.h) { el.dataset.swiped = '1'; setTimeout(() => { delete el.dataset.swiped; }, 350); }
      st = null;
      if (go) fn(d);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', e => { if (el.dataset.swiped) { e.stopPropagation(); e.preventDefault(); } }, true);
  }
  swipe($('#dock'), '.dk-body', d => dockGo(d));
  swipe(P.body, '.bslide', d => { if (B.on && cur().page === 'brief') showSlide(B.i + d); });
  $('#t-search').addEventListener('click', () => focusSearch());
  $('#t-news').addEventListener('click', () => nav('news'));
  $('#t-info').addEventListener('click', () => nav('about'));
  $('#t-list').addEventListener('click', () => nav('list'));
  $('#skip').addEventListener('click', e => { e.preventDefault(); nav('list'); setTimeout(() => { const r = $('.trow', P.body); if (r) r.focus(); }, 80); });
  $('#t-motion').addEventListener('click', () => setMotion(!MO.on));

  /* ---------- phone bottom sheet ---------- */
  const SH = { det: 'mid', h: 0 };
  function detPx(name) {
    const full = innerHeight - 54, top = RD.box.getBoundingClientRect().bottom + 6;
    const mid = clamp(innerHeight - top, 180, full), peek = Math.min(mid, 300);
    return name === 'full' ? full : name === 'peek' ? peek : mid;
  }
  function sheetTo(name, px) {
    if (!PHONE) return;
    if (name) SH.det = name;
    const hgt = px != null ? px : detPx(SH.det);
    SH.h = hgt;
    P.el.style.setProperty('--sh', hgt + 'px');
    P.el.style.setProperty('--shpad', Math.max(0, innerHeight - 54 - hgt) + 'px');
  }
  (() => {
    let d = null;
    const start = e => {
      if (!PHONE || (e.button != null && e.button > 0)) return;
      if (e.target.closest('input, a, button') && !e.target.closest('.grab')) return;
      d = { y: e.clientY, h: SH.h, t: performance.now(), id: e.pointerId, moved: false };
      P.el.classList.add('drag');
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
    };
    const move = e => {
      if (!d || e.pointerId !== d.id) return;
      const dy = e.clientY - d.y;
      if (Math.abs(dy) > 4) d.moved = true;
      sheetTo(null, clamp(d.h - dy, 140, innerHeight - 54));
    };
    const end = e => {
      if (!d || e.pointerId !== d.id) return;
      P.el.classList.remove('drag');
      const dy = e.clientY - d.y, v = dy / Math.max(1, performance.now() - d.t), wasMoved = d.moved, startDet = SH.det;
      d = null;
      const names = ['peek', 'mid', 'full'];
      if (!wasMoved) { sheetTo(startDet === 'full' ? 'mid' : 'full'); return; }
      let best = names.reduce((a, b) => (Math.abs(detPx(b) - SH.h) < Math.abs(detPx(a) - SH.h) ? b : a));
      if (Math.abs(v) > .55) { const i = names.indexOf(startDet); best = names[clamp(i + (v < 0 ? 1 : -1), 0, 2)]; }
      sheetTo(best);
    };
    [$('#grab'), $('#p-top')].forEach(el => {
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    });
  })();

  /* ---------- chrome, toast, hash, keys ---------- */
  function paintChrome() {
    const m = S.meta, txt = S.problem ? '' : m && m.lastScan ? 'Updated ' + ago(m.lastScan) : S.ok.trends ? '' : 'Loading…';
    $$('.upd').forEach(el => { el.textContent = txt; });
    $('#r-sum').textContent = S.trends.length ? RO.map(r => S.trends.filter(t => t.ring === r).length + ' ' + RINGS[r].label.toLowerCase()).join(', ') + '. ' + (D.total ? plural(D.total, 'update') + ' new for you.' : 'Nothing new for you.') : '';
    const tc = $('#t-count'); tc.hidden = !D.total; tc.textContent = D.total > 99 ? '99+' : String(D.total);
    $$('.quad').forEach(b => {
      const list = S.trends.filter(t => t.area === b.dataset.area), nn = list.reduce((s, t) => s + (D.newBy.get(t.id) || 0), 0);
      $('small', b).textContent = '';
    });
  }
  let toastT = 0;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
  let hashT = 0;
  function syncHash() { clearTimeout(hashT); hashT = setTimeout(syncHashNow, 250); }
  function syncHashNow() {
    const c = cur(), want = c.page === 'trend' ? '#t-' + c.arg : /^(news|about|list)$/.test(c.page) ? '#' + c.page : '';
    if ((location.hash || '') === want) return;
    try { history.replaceState(null, '', want || location.pathname + location.search); } catch (e) { /* hash sync is optional */ }
  }
  function readHash() {
    let x = '';
    try { x = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { x = ''; }
    if (x.slice(0, 2) === 't-') return { page: 'trend', arg: x.slice(2) };
    return /^(news|about|list)$/.test(x) ? { page: x } : null;
  }
  let wanted = readHash();
  function useWanted() {
    if (!wanted || !S.ok.trends) return;
    const w = wanted;
    wanted = null;
    if (w.page === 'trend') { if (S.byId.has(w.arg)) openTrend(w.arg, false); } else nav(w.page);
  }
  addEventListener('hashchange', () => { wanted = readHash(); useWanted(); });

  function focusSearch() { nav('search'); P.q.select(); }
  P.q.addEventListener('input', () => {
    S.q = P.q.value;
    if (S.q.trim()) { if (cur().page !== 'search') nav('search'); else renderPanel(false); }
    else if (cur().page === 'search') renderPanel(false);
  });
  P.q.addEventListener('focus', () => { if (PHONE) sheetTo('full'); });
  P.q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const first = $('.trow, .ni-l', P.body); if (first) first.focus(); }
  });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusSearch(); return; }
    if (e.key === 'Escape') {
      if (typing && P.q.value) { P.q.value = ''; P.q.dispatchEvent(new Event('input')); return; }
      if (typing) { e.target.blur(); return; }
      if (B.on) { briefStop(); return; }
      if (cur().page !== 'home') { back(); return; }
      if (S.quad) { setQuad(null); return; }
      if (S.ring) setRing(S.ring);
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (B.on && cur().page === 'brief') {
      if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); togglePlay(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); showSlide(B.i + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); showSlide(B.i - 1); }
      return;
    }
    const onBlip = e.target.closest && e.target.closest('.blip');
    if (cur().page === 'trend' && !onBlip && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); return; }
    if (cur().page === 'home' && !onBlip && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const l = dockList(); if (l.length) dockGo(e.key === 'ArrowRight' ? 1 : -1); return; }
    if (e.key === '/') { e.preventDefault(); focusSearch(); }
    else if (e.key === 'b') briefStart();
    else if (e.key === 'n') nav('news');
    else if (e.key === 'l') nav('list');
    else if (e.key === 'p') setMotion(!MO.on);
    else if (e.key === 'f' && cur().page === 'trend') toggleFollow(cur().arg);
    else if (e.key === '?') nav('about');
    else if ('1234'.includes(e.key) && e.key.length === 1) { const a = AO[+e.key - 1]; setQuad(S.quad === a ? null : a); }
    else if (e.key === '0') setQuad(null);
    else if (e.key === '+' || e.key === '=') zoomAt(RD.W / 2, RD.W / 2, 1.6);
    else if (e.key === '-') { if (RD.cam.k / 1.6 <= 1.05) setQuad(null); else zoomAt(RD.W / 2, RD.W / 2, 1 / 1.6); }
  });
  if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '')) $('#kbd').textContent = 'Ctrl K';

  /* ---------- render loop ---------- */
  let rq = 0, rqHard = false;
  function refresh(soft) {
    if (!soft) rqHard = true;
    if (rq) return;
    rq = requestAnimationFrame(() => {
      rq = 0;
      const hard = rqHard;
      rqHard = false;
      derive();
      paintRadar();
      paintChrome();
      renderDock();
      const pg = cur().page;
      if (pg === 'home' || (hard && pg !== 'brief')) renderPanel(false);
    });
  }
  function layoutAll() {
    const was = PHONE;
    PHONE = mqPhone.matches;
    if (was !== PHONE) WC.clear();
    size();
    RD.sig = '';
    place();
    qboxes();
    if (!RD.raf) placeLabels();
    if (PHONE) sheetTo(SH.det); else { P.el.style.removeProperty('--sh'); P.el.style.removeProperty('--shpad'); }
    if (RD.dockK !== undefined && RD.dockK !== dockRows()) renderDock();
  }
  new ResizeObserver(() => layoutAll()).observe(RD.stage);
  onMq(mqPhone, () => { layoutAll(); renderPanel(false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { WC.clear(); layoutAll(); });
  setInterval(paintChrome, 60000);

  /* ---------- start ---------- */
  function fail(msg) { S.problem = msg; S.ok.trends = true; paintChrome(); renderPanel(false); }
  function getUse(tries) {
    return new Promise(res => {
      let n = 0;
      const tick = () => {
        const c = window.claude;
        if (c && typeof c.use === 'function') { res(name => Promise.resolve().then(() => c.use(name)).catch(() => null)); return; }
        if (++n > tries) { res(null); return; }
        setTimeout(tick, 100);
      };
      tick();
    });
  }
  /* Standalone mode (SharePoint, Teams tab, any static host): no Claude runtime, so the radar reads a plain JSON file
     next to the page (or ?data=<url>) and keeps each reader's state in this browser. Same code path as the live app. */
  async function staticDb() {
    let url = 'radar-data.json';
    try { url = new URLSearchParams(location.search).get('data') || url; } catch (e) { /* default */ }
    let j;
    try { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) return null; j = await r.json(); } catch (e) { return null; }
    if (!j || !Array.isArray(j.trends)) return null;
    const docs = list => (Array.isArray(list) ? list : []).map(x => ({ id: x.id, exists: true, data: () => x }));
    const snap = list => ({ docs: docs(list), exists: true });
    const q = list => { const o = { limit: () => o, orderBy: () => o, where: () => o, onSnapshot(next) { next(snap(list)); return () => {}; }, get: () => Promise.resolve(snap(list)) }; return o; };
    const meta = Object.assign({}, j.meta || {});
    const month = (meta.months && meta.months[0]) || new Date().toISOString().slice(0, 7);
    meta.months = [month];
    return {
      collection: path => q(path === 'trends' ? j.trends : path === 'sources' ? j.sources : path === 'scans' ? j.scans : path === 'feed/' + month + '/items' ? j.news : []),
      doc: path => ({ onSnapshot(next) { next(path === 'meta/status' ? { exists: true, id: 'status', data: () => meta } : { exists: false, data: () => undefined }); return () => {}; }, get: () => Promise.resolve({ exists: false, data: () => undefined }), set: () => Promise.reject(new Error('read-only')) })
    };
  }
  function connect(db, user) {
    S.db = db;
    Me.init(db, user).then(() => { S.ok.me = true; refresh(); maybeReveal(); }, () => { S.ok.me = true; refresh(); maybeReveal(); });
    const dead = () => fail('The radar data is not available right now. Reload to try again.');
    db.collection('trends').limit(300).onSnapshot(snap => {
      setTrends(snap.docs);
      S.ok.trends = true;
      S.problem = '';
      buildNodes();
      layoutAll();
      if (!RD.booted && S.trends.length) boot();
      refresh();
      useWanted();
      maybeReveal();
    }, dead);
    db.doc('meta/status').onSnapshot(d => { S.meta = d.exists ? d.data() : null; watchFeed(); paintChrome(); }, () => watchFeed());
    db.collection('sources').limit(500).onSnapshot(snap => { S.sources = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(x => x.on !== false); if (cur().page === 'about') renderPanel(false); }, () => {});
    db.collection('scans').orderBy('at', 'desc').limit(8).onSnapshot(snap => { S.scans = snap.docs.map(d => d.data()); if (cur().page === 'about') renderPanel(false); }, () => {});
  }
  async function start() {
    buildBands();
    layoutAll();
    renderPanel(true);
    paintChrome();
    let use = await getUse(8);
    if (!use) {
      const db = await staticDb();
      if (db) { S.standalone = true; connect(db, null); return; }
      use = await getUse(32);
    }
    if (!use) return fail('The radar data could not be loaded. Put radar-data.json next to this page, or open it in the Claude app.');
    use('downloads').then(x => { S.dl = x && typeof x.save === 'function' ? x : null; });
    const [db, user] = await Promise.all([use('db'), use('user')]);
    if (!db) return fail('Sign in to Claude to see the radar.');
    connect(db, user);
  }
  start();
})();
</script>
