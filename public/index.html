<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A radar of technology megatrends for technology leaders, with news from top-tier sources every 12 hours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230b0b0d%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2211%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff66%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%2016V5a11%2011%200%200%201%2010.5%207.6z%22%20fill%3D%22%23ff9f0a%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%222.5%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>Tech Trend Radar</title>
<style>
/* Design tokens. Every colour, size and curve used by the app is defined here.
   Colour rule: greys carry structure, white marks what you can act on, orange means only "new for you". */
:root {
  color-scheme: dark;
  interpolate-size: allow-keywords;

  /* surfaces */
  --bg: #0b0b0d;
  --panel: rgb(22 22 25 / .95);
  --glass: rgb(36 36 40 / .62);
  --glass-strong: rgb(24 24 28 / .86);
  --fill-1: rgb(255 255 255 / .06);   /* resting fill of controls and rows */
  --fill-2: rgb(255 255 255 / .12);   /* hover fill */
  --line: rgb(255 255 255 / .1);
  --line-2: rgb(255 255 255 / .18);
  --halo: rgb(11 11 13 / .88);        /* text halo on the radar */

  /* text */
  --t1: #f5f5f7;                      /* primary, and every clickable label */
  --t2: rgb(235 235 245 / .74);       /* reading text */
  --t3: rgb(235 235 245 / .58);       /* meta: sources, dates, section titles */
  --ink: #111113;                     /* text on light fills */

  /* the one accent */
  --orange: #ff9f0a;
  --orange-ink: #1a1000;

  /* rings: urgency is carried by position, so the rings are greys from bright (act) to dim (horizon) */
  --act: #f5f5f7;
  --prepare: #c7c7cc;
  --watch: #a1a1a8;
  --horizon: #7c7c84;

  /* type scale (Apple text styles, desktop sizes) */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --fs-display: 26px;  /* trend title */
  --fs-title: 20px;    /* briefing story, archive month */
  --fs-lead: 17px;     /* trend summary, briefing text */
  --fs-body: 15px;     /* headlines, rows, buttons */
  --fs-sub: 14px;      /* reading text under a headline */
  --fs-foot: 13px;     /* section titles, meta */
  --fs-cap: 12px;      /* pills, captions */

  /* motion */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);

  /* layout */
  --side: 388px;       /* panel width */
  --gap: 16px;         /* outer margin of floating surfaces */
  --bar: 64px;         /* top bar height */
}
.c-act { --c: var(--act); }
.c-prepare { --c: var(--prepare); }
.c-watch { --c: var(--watch); }
.c-horizon { --c: var(--horizon); }

/* Base elements and the shared control set: icon button, primary button, text button, link, pill. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--t1); font: var(--fs-body)/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.skip { position: absolute; z-index: 60; left: 12px; top: 10px; padding: 10px 16px; border-radius: 12px; background: #fff; color: var(--ink); font-weight: 600; text-decoration: none; transform: translateY(-160%); transition: transform .2s; }
.skip:focus { transform: none; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
kbd { display: inline-block; font: 600 var(--fs-cap) var(--font); color: var(--t3); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }

/* Icon button: 36px circle, for navigation and secondary actions. */
.iconbtn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--fill-1); color: var(--t2); cursor: pointer; transition: background .2s, color .2s, transform .15s; }
.iconbtn:hover { background: var(--fill-2); color: var(--t1); }
.iconbtn:active { transform: scale(.92); }
.iconbtn:disabled { opacity: .35; cursor: default; pointer-events: none; }

/* Primary: the single white circle that starts the briefing. */
.primary { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--t1); color: var(--ink); cursor: pointer; transition: transform .15s, background .2s; }
.primary:hover { background: #fff; }
.primary:active { transform: scale(.94); }
.primary .ic { width: 19px; height: 19px; fill: currentColor; stroke: none; }
.primary .ic use[href="#i-play"] { transform: translateX(1px); }

/* Text button (capsule). */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--fill-1); color: var(--t1); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform .18s var(--ease), background .2s; }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.96); }

/* Links. Anything you can click is white and semibold and carries a glyph: › opens inside the radar, ↗ opens the source. */
.link { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; min-height: 32px; padding: 0; border: 0; background: none; color: var(--t1); font-size: var(--fs-body); font-weight: 600; text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link .ic { width: 16px; height: 16px; color: var(--t3); }
.out { display: inline-flex; align-items: baseline; gap: 4px; color: var(--t1); font-weight: 600; text-decoration: none; }
.out:hover span { text-decoration: underline; text-underline-offset: 3px; }
.out .ic { width: 13px; height: 13px; align-self: center; color: var(--t3); }
/* Trend chip inside news meta: a small filled capsule so it reads as a button, not as text. */
.link.sm { min-height: 22px; padding: 0 8px; border-radius: 6px; background: var(--fill-1); font-size: var(--fs-cap); }
.link.sm:hover { background: var(--fill-2); text-decoration: none; }

/* Pills: orange = new for you, white = hot (must read or listen), grey = moved. */
.pillnew, .pillmove { flex: none; height: 20px; padding: 0 7px; border-radius: 10px; font: 700 var(--fs-cap)/20px var(--round); white-space: nowrap; }
.pillnew { background: var(--orange); color: var(--orange-ink); }
.pillhot { display: inline-block; flex: none; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--t1); color: var(--ink); font: 700 11px/18px var(--round); white-space: nowrap; vertical-align: 1px; }
.ni-b > .pillhot { display: block; width: fit-content; margin: 0 0 6px; }
.dk-kick .pillhot, .bsrc .pillhot { margin-right: 6px; }
.pillmove { background: var(--fill-2); color: var(--t1); }
.chev { width: 16px; height: 16px; color: var(--t3); }
.muted { margin: 0; color: var(--t3); font-size: var(--fs-sub); }
.note { margin: 8px 0 0; color: var(--t3); font-size: var(--fs-foot); line-height: 1.42; }
.fine { margin: 8px 0 0; color: var(--t3); font-size: var(--fs-cap); }

@keyframes fadein { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* App frame: backdrop, top bar, stage (radar area), floating zoom control, side panel. Desktop first. */
.app { position: fixed; inset: 0; isolation: isolate; overflow: hidden; }
.aurora { position: absolute; inset: 0; z-index: -1; overflow: hidden; contain: strict; background: radial-gradient(120% 80% at 65% 10%, #18181d 0%, var(--bg) 58%); }

/* top bar */
.topbar { position: absolute; z-index: 12; inset: 0 0 auto; height: var(--bar); padding: 0 16px 0 22px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; contain: layout style; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 22px; height: 22px; flex: none; }
.logo .slice { fill: var(--orange); }
.brand b { display: block; font-size: var(--fs-body); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font-size: var(--fs-cap); color: var(--t3); white-space: nowrap; }
.tools { display: flex; gap: 2px; }
.tool { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--t2); cursor: pointer; transition: background .2s, color .2s; }
.tool:hover { background: var(--fill-1); color: var(--t1); }
.tool[aria-label="Play motion"] { color: var(--t3); }
.tcount { position: absolute; top: 3px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--orange); color: var(--orange-ink); font: 700 11px/17px var(--round); text-align: center; }

/* stage: the radar is centred in the space the panel leaves free */
.stage { position: absolute; inset: 56px 0 0 0; overflow: hidden; }
.rbox { position: absolute; left: 50%; top: calc(50% - 55px); width: var(--rs, 600px); height: var(--rs, 600px); translate: -50% -50%; touch-action: none; transition: transform .4s var(--spring), opacity .3s var(--ease); }
.app.wide .rbox { top: calc(50% - 12px); }
.app.open .rbox, .app.open .dock { transform: translateX(calc((var(--side) + var(--gap) * 2) / -2)); }
.rbox.zoomed { cursor: grab; }
.rbox.zoomed.moving { cursor: grabbing; }

/* Zoom: one glass capsule, plus over minus, divided by a hairline. Bottom left of the stage, clear of the panel and the news bar. */
.zoomui { position: absolute; z-index: 5; left: 20px; bottom: 24px; display: flex; flex-direction: column; width: 40px; border-radius: 20px; overflow: hidden; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); }
.zbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--t1); cursor: pointer; transition: background .15s, color .15s; }
.zbtn + .zbtn { border-top: 1px solid var(--line); }
.zbtn:hover { background: var(--fill-1); }
.zbtn:active { background: var(--fill-2); }
.zbtn:disabled { color: var(--t3); opacity: .45; cursor: default; background: none; }
.zbtn .ic { width: 16px; height: 16px; stroke-width: 2; }

/* side panel (right); permanent on wide screens, on demand otherwise; a bottom sheet on phones (see responsive) */
.panel {
  position: absolute; z-index: 10; right: var(--gap); top: 70px; bottom: var(--gap); width: var(--side);
  display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; timeline-scope: --pb; contain: layout style;
  background: var(--panel); border: 1px solid rgb(255 255 255 / .07);
  transition: opacity .3s var(--ease), transform .45s var(--spring), visibility .3s;
}
.app:not(.open) .panel { opacity: 0; visibility: hidden; transform: translateX(28px); pointer-events: none; }
.grab { display: none; }
.p-top { flex: none; display: none; padding: 16px 18px 12px; }
.panel[data-page="search"] .p-top { display: block; }
.search { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; border-radius: 12px; background: var(--fill-1); border: 1px solid transparent; color: var(--t3); transition: border-color .2s, background .2s; }
.search:focus-within { border-color: rgb(255 255 255 / .35); background: rgb(0 0 0 / .4); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: var(--fs-body); color: var(--t1); }
.search input::placeholder { color: var(--t3); }
.search input::-webkit-search-cancel-button { display: none; }
.p-head { flex: none; display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 10px 12px 6px; }
.p-head .ht { flex: 1; min-width: 0; font-weight: 600; font-size: var(--fs-body); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 22px 32px; display: flex; flex-direction: column; gap: 28px; scroll-timeline: --pb y; scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / .2) transparent; contain: content; }
.p-body > * { flex-shrink: 0; }
.p-body.enter > :first-child, .p-body.enter > :nth-child(2) { animation: rise .24s var(--ease) both; }
.p-body.enter > :nth-child(2) { animation-delay: .03s; }
.p-body.enter > :nth-child(n+3) { animation: fadein .24s var(--ease) .05s both; }
@supports (animation-timeline: scroll()) {
  .p-head .ht.collapse { animation: ht-in linear both; animation-timeline: --pb; animation-range: 50px 110px; }
  @keyframes ht-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* tooltip and toast */
.tip { position: fixed; z-index: 30; left: 0; top: 0; max-width: 280px; padding: 10px 14px; border-radius: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; pointer-events: none; opacity: 0; transition: opacity .18s; contain: layout style;
  background: var(--glass-strong); border: 1px solid var(--line); -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%); }
.tip.on { opacity: 1; }
.tip .k { display: flex; align-items: center; gap: 7px; font-size: var(--fs-cap); color: var(--t3); }
.tip .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tip b { font-size: var(--fs-body); font-weight: 600; letter-spacing: -.01em; }
.tip .tmove { font-size: var(--fs-foot); color: var(--t2); }
.tip .pillnew { margin-top: 3px; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: 28px; max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 999px; translate: -50% 0; transform: translateY(14px); opacity: 0; pointer-events: none; background: rgb(255 255 255 / .94); color: var(--ink); font-size: var(--fs-sub); font-weight: 600; transition: opacity .25s, transform .4s var(--spring); contain: layout style; }
.toast.on { opacity: 1; transform: none; }

/* The radar: rings, area buttons, dots, labels, motion overlay. SVG text uses a dark halo so it reads on any ring. */
.rbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; will-change: transform; }
.rbox.zoomed > svg, .rbox.zoomed > .fx { overflow: hidden; }
.sweep { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; will-change: transform; background: conic-gradient(from 0deg, rgb(255 255 255 / 0) 0deg 280deg, rgb(255 255 255 / .04) 320deg, rgb(255 255 255 / .2) 359deg, rgb(255 255 255 / 0) 360deg); }
.rbox.zoomed .sweep { display: none; }

/* area buttons in the four corners */
.quad { position: absolute; z-index: 2; display: flex; flex-direction: column; padding: 6px 8px; border: 0; border-radius: 10px; background: none; color: var(--t2); font-size: var(--fs-foot); font-weight: 600; cursor: pointer; transition: background .2s, color .2s, opacity .3s; }
.quad:hover { background: var(--fill-1); color: var(--t1); }
.q-ai { left: -8px; top: -8px; }
.q-sec { right: -8px; top: -8px; text-align: right; }
.q-cloud { left: -8px; bottom: -8px; }
.q-sci { right: -8px; bottom: -8px; text-align: right; }
.rbox.zoomed .quad { opacity: 0; pointer-events: none; }
.allbtn { position: absolute; z-index: 3; left: 50%; top: -6px; translate: -50% 0; }

/* rings and axes */
/* Rings read as stepped tints (brightest at the centre) with a clear hairline, so the four zones are visible at a glance. */
.band { stroke: rgb(255 255 255 / .16); stroke-width: 1; }
.b-act { fill: rgb(255 255 255 / .06); stroke: rgb(255 255 255 / .3); }
.b-prepare { fill: rgb(255 255 255 / .035); }
.b-watch { fill: rgb(255 255 255 / .018); }
.b-horizon { fill: rgb(255 255 255 / .008); }
.axis { stroke: rgb(255 255 255 / .07); stroke-width: 1; }
.rl { font: 600 11.5px var(--font); fill: rgb(235 235 245 / .55); letter-spacing: .02em; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; transition: fill .3s, opacity .3s; }
.rl.on { fill: #fff; }
.rbox.tiny .rl { display: none; }
.rbox[data-ring]:not([data-ring=""]) .rl:not(.on) { opacity: .35; }

/* dots: size = business impact (weight 1 to 3); fill = ring grey; orange = news you have not opened */
.blip { cursor: pointer; outline: none; transition: opacity .35s; }
.blip .hit { fill: transparent; }
.blip .dot { fill: var(--c); stroke: rgb(11 11 13 / .9); stroke-width: 1.5; }
.blip.has-new .dot { fill: var(--orange); }
.rbox:not(.zoomed) .blip.w1 .dot { opacity: .8; }
.blip .ring { fill: none; stroke: #fff; stroke-width: 2; opacity: 0; transition: opacity .2s; }
.blip.has-new .ring { opacity: .55; stroke: var(--orange); stroke-width: 1.5; }
.blip.sel .ring, .blip:focus-visible .ring { opacity: 1; stroke: #fff; stroke-width: 2; }
.blip.cue .ring { opacity: 0; }
.blip .pop { transform-box: fill-box; transform-origin: center; transition: transform .4s var(--spring); }
.blip:hover .pop, .blip.hot .pop, .blip.sel .pop, .blip:focus-visible .pop { transform: scale(1.25); }
/* movement chevron: rating changed in the last 90 days; points to the centre when it became more urgent */
.arr { fill: none; stroke: var(--t1); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.blip.dim, .lbl.dim { opacity: .18; }
.rbox.hovering .blip:not(.hot):not(.sel), .rbox.hovering .lbl:not(.hot):not(.sel), .rbox.hovering .lbl2 { opacity: .4; }
.trail { fill: none; stroke: rgb(255 255 255 / .5); stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }

/* labels */
.lbl, .lbl2 { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; transition: opacity .3s; }
.lbl { font: 500 13px var(--font); fill: rgb(245 245 247 / .9); }
.lbl.w3 { font-weight: 600; }
.lbl.new { fill: #fff; font-weight: 600; }
.lbl.sel, .lbl.hot { fill: #fff; font-weight: 700; }
.lbl2 { font: 400 11px var(--font); fill: rgb(235 235 245 / .62); }
.lbl.off, .rbox.nolabels .lbl, .rbox.nolabels .lbl2 { opacity: 0 !important; }
.ld { stroke: rgb(255 255 255 / .35); stroke-width: 1; }
.rbox.moving .ld, .rbox.nolabels .ld { display: none; }
.rbox.briefing .lbl:not(.sel), .rbox.briefing .lbl2, .rbox.briefing .ld { opacity: 0 !important; }

/* motion overlay (HTML, so endless animations stay on the compositor) */
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; will-change: transform; }
.pg, .fxr { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; }
.pg { width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 2px solid #fff; opacity: 0; }
.fxr { width: 27px; height: 27px; margin: -13.5px 0 0 -13.5px; opacity: 0; transition: opacity .3s; }
.fxr.on { opacity: 1; }
.fx-cue { border: 2px dashed rgb(255 255 255 / .85); }
.fx-sel { border: 2px solid rgb(255 255 255 / .55); }
.fx-sel.on { animation: selpulse .9s ease-out 2; }
.app.still .fxr { animation-play-state: paused; }
.app.still .fx-sel { animation: none; opacity: 0; }
@keyframes selpulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
.rbox.briefing .allbtn { display: none; }

/* Panel content. Hierarchy: grey section title (13) > white headline (15, semibold) > grey reading text (14) > meta (12).
   Clickable items are always white semibold with › or ↗; everything grey is information only. */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h2 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: var(--fs-foot); font-weight: 600; color: var(--t3); }
.sec > h2 span + span { font-weight: 400; }
.rh { display: inline-flex; align-items: center; gap: 8px; color: var(--t1); }
.rh i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* trend header */
.thead { display: flex; flex-direction: column; gap: 8px; }
.kicker { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--fs-foot); color: var(--t3); }
.kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.title { margin: 0; font-size: var(--fs-display); line-height: 1.15; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; outline: none; }
.lead { margin: 0; font-size: var(--fs-lead); line-height: 1.45; color: var(--t2); text-wrap: pretty; }
.moved { margin: 4px 0 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--fill-1); font-size: var(--fs-sub); color: var(--t1); }
.moved .ic { margin-top: 1px; }

/* rows (trend lists, months) */
.rows { display: flex; flex-direction: column; margin: 0 -10px; }
.trow { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 10px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; transition: background .15s; content-visibility: auto; contain-intrinsic-size: auto 56px; }
.trow:hover { background: var(--fill-1); }
.arch-row { grid-template-columns: minmax(0, 1fr) auto; }
.tdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tt { min-width: 0; }

.keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: var(--fs-sub); color: var(--t2); }

// ---- 02-vocabulary.js
/* The fixed vocabulary of the radar: areas (quadrants), rings, weights and expert statements. */

  sec: { label: 'Security & trust', a0: 270, cx: .5, cy: -.5 },

  prepare: { label: 'Prepare', hint: 'Plan and pilot within 12 months', r0: .44, r1: .67 },
  watch: { label: 'Watch', hint: 'Track it, likely 1 to 3 years out', r0: .67, r1: .85 },
  horizon: { label: 'Horizon', hint: 'Research stage, 3 or more years out', r0: .85, r1: 1 }

// ---- 03-dates.js

  wday: new Intl.DateTimeFormat('en-GB', { weekday: 'long', timeZone: 'UTC' }),
  month: new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }),

}

// ---- 04-reader-state.js

// ---- 05-data.js
/* Turns database snapshots into trends and news. Recent months are live; older months load on demand. */
function setTrends(docs) {

  const all = [];

  all.sort((a, b) => ts(b.at) - ts(a.at) || ts(b.seen) - ts(a.seen) || str(a.title).localeCompare(str(b.title)));
  S.news = all.filter(n => !n.dup);
  S.byT = new Map();
  for (const n of S.news) for (const k of tkeys(n)) { if (!S.byT.has(k)) S.byT.set(k, []); S.byT.get(k).push(n); }

  const x = Object.assign({}, d.data(), { id: d.id });
  x.src = x.src && typeof x.src === 'object' ? x.src : {};

};
function watchFeed() {

  if (!months.length) months = [new Date().toISOString().slice(0, 7)];
  for (const m of Object.keys(S.subs)) if (!months.slice(0, 3).includes(m)) { try { S.subs[m](); } catch (e) { /* already closed */ } delete S.subs[m]; }

    if (S.subs[m]) return;
    S.subs[m] = db.collection('feed/' + m + '/items').limit(1000).onSnapshot(snap => {
      S.months[m] = snap.docs.map(asNews);
      setNews();
      S.ok.news = true;
      refresh();
      maybeReveal();
    }, () => { S.ok.news = true; refresh(); maybeReveal(); });

  if (e.key === 'Enter') { e.preventDefault(); const first = $('.trow, .ni-l', P.body); if (first) first.focus(); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusSearch(); return; }
  if (e.key === 'Escape') {
    if (typing && P.q.value) { P.q.value = ''; P.q.dispatchEvent(new Event('input')); return; }
    if (typing) { e.target.blur(); return; }
    if (B.on) { briefStop(); return; }
    if (cur().page !== 'home') { back(); return; }
    if (S.quad) { setQuad(null); return; }
    if (S.ring) setRing(S.ring);
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (B.on && cur().page === 'brief' && !(e.target.closest && e.target.closest('.blip'))) {
    if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); showSlide(B.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); showSlide(B.i - 1); }
    return;
  }
  const onBlip = e.target.closest && e.target.closest('.blip');
  if (cur().page === 'trend' && !onBlip && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (cur().page === 'home' && !onBlip && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const l = dockList(); if (l.length) dockGo(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (e.key === '/') { e.preventDefault(); focusSearch(); }
  else if (e.key === 'b') briefStart();
  else if (e.key === 'n') nav('news');
  else if (e.key === 'l') nav('list');
  else if (e.key === 'p') setMotion(!MO.on);
  else if (e.key === '?') nav('about');
  else if ('1234'.includes(e.key) && e.key.length === 1) { const a = AO[+e.key - 1]; setQuad(S.quad === a ? null : a); }
  else if (e.key === '0') setQuad(null);
  else if (e.key === '+' || e.key === '=') zoomAt(RD.W / 2, RD.W / 2, 1.6);
  else if (e.key === '-') { if (RD.cam.k / 1.6 <= 1.05) setQuad(null); else zoomAt(RD.W / 2, RD.W / 2, 1 / 1.6); }
});

// ---- 17-render.js
/* Render loop: batches refreshes into one frame and re-lays out on resize. */
let rq = 0, rqHard = false;
function refresh(soft) {
  if (!soft) rqHard = true;
  if (rq) return;
  rq = requestAnimationFrame(() => {
    rq = 0;
    const hard = rqHard;
    rqHard = false;
    derive();
    paintRadar();
    paintChrome();
    renderDock('quiet');
    const pg = cur().page;
    if (pg === 'home' || (hard && pg !== 'brief')) renderPanel(false);
  });
}
function layoutAll() {
  const was = PHONE;
  PHONE = mqPhone.matches;
  WIDE = mqWide.matches && !PHONE;
  if (was !== PHONE) WC.clear();
  size();
  RD.sig = '';
  place();
  qboxes();
  if (!RD.raf) placeLabels();
  if (PHONE) sheetTo(SH.det); else { P.el.style.removeProperty('--sh'); P.el.style.removeProperty('--shpad'); }
  if (RD.dockK !== undefined && RD.dockK !== dockRows()) renderDock();
}
new ResizeObserver(() => layoutAll()).observe(RD.stage);
onMq(mqPhone, () => { layoutAll(); renderPanel(false); });
onMq(mqWide, () => { layoutAll(); afterNav(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { WC.clear(); layoutAll(); });
setInterval(paintChrome, 60000);

// ---- 18-start.js
/* Start-up: Claude runtime (live database) or standalone mode (radar-data.json on any static host). */
function fail(msg) { S.problem = msg; S.ok.trends = true; paintChrome(); renderPanel(false); }
function getUse(tries) {
  return new Promise(res => {
    let n = 0;
    const tick = () => {
      const c = window.claude;
      if (c && typeof c.use === 'function') { res(name => Promise.resolve().then(() => c.use(name)).catch(() => null)); return; }
      if (++n > tries) { res(null); return; }
      setTimeout(tick, 100);
    };
    tick();
  });
}
/* Standalone mode (SharePoint, Teams tab, any static host): no Claude runtime, so the radar reads a plain JSON file
   next to the page (or ?data=<url>) and keeps each reader's state in this browser. Same code path as the live app. */
async function staticDb() {
  let url = 'radar-data.json';
  try { url = new URLSearchParams(location.search).get('data') || url; } catch (e) { /* default */ }
  const base = url.replace(/[^/]*$/, '');
  let j;
  try { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) return null; j = await r.json(); } catch (e) { return null; }
  if (!j || !Array.isArray(j.trends)) return null;
  const docs = list => (Array.isArray(list) ? list : []).map(x => ({ id: x.id, exists: true, data: () => x }));
  const snap = list => ({ docs: docs(list), exists: true });
  // A query over a list that may still need loading (older months live in archive/<YYYY-MM>.json).
  const q = load => { const o = { limit: () => o, orderBy: () => o, where: () => o, onSnapshot(next, err) { load().then(l => next(snap(l)), e => err && err(e)); return () => {}; }, get: () => load().then(snap) }; return o; };
  const meta = Object.assign({}, j.meta || {});
  const months = Array.isArray(meta.months) && meta.months.length ? meta.months : [new Date().toISOString().slice(0, 7)];
  const recent = new Set(Array.isArray(j.recentMonths) ? j.recentMonths : [months[0]]);
  const now = l => () => Promise.resolve(Array.isArray(l) ? l : []);
  const month = m => recent.has(m) ? now((j.news || []).filter(n => (n.month || months[0]) === m))
    : () => fetch(base + 'archive/' + m + '.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : { news: [] })).then(x => x.news || []);
  return {
    collection: path => { const f = /^feed\/(\d{4}-\d{2})\/items$/.exec(path); return q(f ? month(f[1]) : now(path === 'trends' ? j.trends : path === 'sources' ? j.sources : path === 'scans' ? j.scans : [])); },
    doc: path => ({ onSnapshot(next) { next(path === 'meta/status' ? { exists: true, id: 'status', data: () => meta } : { exists: false, data: () => undefined }); return () => {}; }, get: () => Promise.resolve({ exists: false, data: () => undefined }), set: () => Promise.reject(new Error('read-only')) })
  };
}
function connect(db, user) {
  S.db = db;
  Me.init(db, user).then(() => { S.ok.me = true; refresh(); maybeReveal(); }, () => { S.ok.me = true; refresh(); maybeReveal(); });
  const dead = () => fail('The radar data is not available right now. Reload to try again.');
  db.collection('trends').limit(300).onSnapshot(snap => {
    setTrends(snap.docs);
    S.ok.trends = true;
    S.problem = '';
    buildNodes();
    layoutAll();
    if (!RD.booted && S.trends.length) boot();
    refresh();
    useWanted();
    maybeReveal();
  }, dead);
  db.doc('meta/status').onSnapshot(d => { S.meta = d.exists ? d.data() : null; watchFeed(); paintChrome(); }, () => watchFeed());
  db.collection('sources').limit(500).onSnapshot(snap => { S.sources = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).filter(x => x.on !== false); if (cur().page === 'about') renderPanel(false); }, () => {});
  db.collection('scans').orderBy('at', 'desc').limit(8).onSnapshot(snap => { S.scans = snap.docs.map(d => d.data()); if (cur().page === 'about') renderPanel(false); }, () => {});
}
async function start() {
  buildBands();
  layoutAll();
  afterNav();
  paintChrome();
  let use = await getUse(8);
  if (!use) {
    const db = await staticDb();
    if (db) { connect(db, null); return; }
    use = await getUse(32);
  }
  if (!use) return fail('The radar data could not be loaded. Put radar-data.json next to this page, or open it in the Claude app.');
  const [db, user] = await Promise.all([use('db'), use('user')]);
  if (!db) return fail('Sign in to Claude to see the radar.');
  connect(db, user);
}
start();
})();
